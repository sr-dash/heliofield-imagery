# Each night, after HelioField's daily product: the images for every new (or
# rebuilt) day, published on the `site` branch, which GitHub Pages serves.
# The branch is one commit, replaced each night, so the repository stays the
# size of the images on show (the last 60 days and one day per Carrington
# rotation before that) instead of growing with history.
name: Daily images

# A check that takes seconds runs after each of HelioField's daily attempts
# (18:40, 20:40 and 23:40 UTC, 02:40 as a backstop): a new product, a day whose
# map was rebuilt, a day with panels missing because an archive did not
# answer (`incomplete` in its index), or a live site behind its branch. Only
# then are the images built or redeployed, so a new day's images follow its
# field within about 15 minutes. (An hourly schedule was tried; GitHub ran it
# only every few hours.)
on:
  schedule:
    - cron: "55 18 * * *"
    - cron: "55 20 * * *"
    - cron: "55 23 * * *"
    - cron: "55 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "One day to (re)build, YYYY-MM-DD; empty for the recent days"
        required: false

permissions:
  contents: write

# Print each line as it comes, so the live log shows progress.
env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: daily-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      published: ${{ steps.publish.outputs.published == 'true' || steps.check.outputs.redeploy == 'true' }}
    steps:
      # What to build is judged against the `site` branch, which this job
      # writes; whether to redeploy, by comparing the live index with it, so
      # a deployment that reported success but did not take is put right.
      - name: Anything to do?
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, time, urllib.request
          def get(u):
              return json.load(urllib.request.urlopen(f"{u}?t={int(time.time())}", timeout=60))
          field = "https://sr-dash.github.io/heliofield/data/"
          branch = "https://raw.githubusercontent.com/sr-dash/heliofield-imagery/site/"
          live = "https://sr-dash.github.io/heliofield-imagery/"
          idx = get(branch + "index.json")
          have = set(idx["dates"])
          todo = []
          for d in get(field + "index.json")["dates"][-7:]:
              if d not in have:
                  todo.append(d); continue
              day = get(branch + f"days/{d}/index.json")
              if day.get("incomplete") or day["map_time"][:16] != get(field + f"{d}/meta.json")["obstime"][:16]:
                  todo.append(d)
          try:
              stale = get(live + "index.json").get("updated") != idx.get("updated")
          except Exception:
              stale = True
          print("go=" + ("true" if todo else "false"))
          print("redeploy=" + ("true" if stale else "false"))
          print("to do: " + (", ".join(todo) or "nothing") + ("; the live site is behind the branch" if stale else ""), file=sys.stderr)
          PY

      - uses: actions/checkout@v7
        if: steps.check.outputs.go == 'true' || steps.check.outputs.redeploy == 'true' || inputs.date != ''

      - name: The images on show now
        if: steps.check.outputs.go == 'true' || steps.check.outputs.redeploy == 'true' || inputs.date != ''
        run: |
          mkdir -p site
          if git fetch --depth 1 origin site:refs/remotes/origin/site; then git archive origin/site | tar -x -C site; fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.go == 'true' || inputs.date != ''
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.check.outputs.go == 'true' || inputs.date != ''

      # Daily LASCO medians for the backgrounds: rebuilt from the quick-look
      # archive (9 days) if the cache is ever lost.
      - uses: actions/cache@v5
        if: steps.check.outputs.go == 'true' || inputs.date != ''
        with:
          path: bg
          key: lasco-bg-${{ github.run_id }}
          restore-keys: lasco-bg-

      - name: Build
        if: steps.check.outputs.go == 'true' || inputs.date != ''
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python build.py --out site --date "${{ inputs.date }}" --force --prune
          else
            python build.py --out site --recent 7 --prune
          fi
          touch site/.nojekyll

      - name: Publish
        id: publish
        if: steps.check.outputs.go == 'true' || inputs.date != ''
        run: |
          git config user.name "Soumyaranjan Dash"
          git config user.email "sdash@nso.edu"
          export GIT_INDEX_FILE="$RUNNER_TEMP/site-index"
          git --work-tree=site add -A
          tree=$(git write-tree)
          if git rev-parse -q --verify origin/site >/dev/null && [ "$(git rev-parse origin/site^{tree})" = "$tree" ]; then
            echo "No change."; exit 0
          fi
          commit=$(echo "Images through $(date -u +%F)" | git commit-tree "$tree")
          git push --force origin "${commit}:refs/heads/site"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The site as GitHub Pages serves it: deployed by the job below, with
      # its own timeout, rather than by GitHub's branch deployment, whose
      # fixed 10 minutes the few thousand files sometimes overran.
      - uses: actions/upload-pages-artifact@v5
        if: steps.publish.outputs.published == 'true' || steps.check.outputs.redeploy == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
