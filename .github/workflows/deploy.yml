# Deploys the `site` branch to GitHub Pages as it stands: for days published
# by hand (see the README), or to redeploy. The hourly image workflow deploys
# what it publishes itself.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
